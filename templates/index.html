<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimLife — Memory Simulation</title>
<style>
  :root {
    --bg: #0d1117; --surface: #161b22; --border: #30363d;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff;
    --green: #3fb950; --red: #f85149; --yellow: #d29922;
    --magenta: #bc8cff; --cyan: #39d353;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; overflow: hidden; height: 100vh; }
  .app { display: grid; grid-template-columns: 1fr 340px; grid-template-rows: 48px 1fr; height: 100vh; gap: 0; }

  /* Header */
  .header { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
  .header h1 { font-size: 16px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .header .stat { color: var(--dim); white-space: nowrap; }
  .header .stat b { color: var(--text); }
  .header .controls { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .header button { background: var(--border); color: var(--text); border: none; border-radius: 6px; padding: 4px 12px; cursor: pointer; font-size: 12px; }
  .header button:hover { background: #484f58; }
  .header button.active { background: var(--accent); color: #000; }
  .header label { color: var(--dim); font-size: 11px; }
  .header select { background: var(--border); color: var(--text); border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px; font-size: 12px; }

  /* Replay controls */
  .replay-bar { grid-column: 1 / -1; display: none; align-items: center; gap: 12px; padding: 6px 16px; background: #1c2128; border-bottom: 1px solid var(--border); font-size: 12px; }
  .replay-bar.visible { display: flex; }
  .replay-bar .replay-label { color: var(--accent); font-weight: 700; white-space: nowrap; }
  .replay-bar input[type=range] { flex: 1; accent-color: var(--accent); }
  .replay-bar .replay-tick { color: var(--text); font-family: monospace; min-width: 100px; }
  .replay-bar button { background: var(--border); color: var(--text); border: none; border-radius: 4px; padding: 3px 10px; cursor: pointer; font-size: 11px; }
  .replay-bar button:hover { background: #484f58; }
  .replay-bar button.active { background: var(--accent); color: #000; }

  /* Observer timeline */
  .observer-panel { display: none; flex-direction: column; border-top: 1px solid var(--border); max-height: 260px; overflow: hidden; }
  .observer-panel.visible { display: flex; }
  .observer-panel h3 { font-size: 11px; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; padding: 8px 14px 4px; }
  .observer-summary { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; padding: 4px 14px 8px; font-size: 11px; }
  .observer-summary .os-label { color: var(--dim); }
  .observer-summary .os-value { color: var(--text); font-weight: 600; }
  .observer-timeline { flex: 1; overflow-y: auto; padding: 0 14px 10px; }
  .observer-timeline .obs-ev { display: flex; gap: 8px; padding: 3px 0; font-size: 11px; border-bottom: 1px solid rgba(48,54,61,0.5); align-items: flex-start; }
  .observer-timeline .obs-tick { color: var(--dim); font-family: monospace; min-width: 40px; flex-shrink: 0; }
  .observer-timeline .obs-type { font-weight: 700; min-width: 70px; flex-shrink: 0; }
  .observer-timeline .obs-type.action { color: var(--accent); }
  .observer-timeline .obs-type.memory { color: var(--green); }
  .observer-timeline .obs-type.decision { color: var(--yellow); }
  .observer-timeline .obs-type.death { color: var(--red); }
  .observer-timeline .obs-type.state { color: var(--magenta); }
  .observer-timeline .obs-type.share { color: var(--cyan); }
  .observer-timeline .obs-desc { color: var(--text); flex: 1; }
  .observer-timeline .obs-reason { color: var(--dim); font-style: italic; font-size: 10px; }
  .observer-timeline .obs-state { color: var(--dim); font-family: monospace; font-size: 10px; white-space: nowrap; }
  .observer-energy-bar { padding: 4px 14px; }
  .observer-energy-bar .bar-track { height: 4px; }

  /* Main area */
  .main { display: flex; flex-direction: column; overflow: hidden; }
  .world-wrap { flex: 1; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #000; }
  #worldCanvas { image-rendering: pixelated; cursor: crosshair; }
  .world-tooltip { position: absolute; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 11px; pointer-events: none; display: none; z-index: 10; max-width: 200px; }
  .world-tooltip .tt-name { font-weight: 700; margin-bottom: 2px; }
  .world-tooltip .tt-line { color: var(--dim); }
  .legend { position: absolute; bottom: 8px; left: 8px; background: rgba(13,17,23,0.9); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; font-size: 11px; display: flex; gap: 10px; flex-wrap: wrap; }
  .legend .lg { display: flex; align-items: center; gap: 3px; }
  .legend .lg-char { font-weight: 700; }

  /* Chart */
  .chart-wrap { height: 140px; background: var(--surface); border-top: 1px solid var(--border); padding: 8px 12px; flex-shrink: 0; }
  .chart-wrap h3 { font-size: 11px; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  #popCanvas, #memCanvas { width: 100%; height: 100px; }

  /* Sidebar */
  .sidebar { background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
  .sidebar h3 { font-size: 11px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; padding: 10px 14px 6px; }
  .sidebar .section { border-bottom: 1px solid var(--border); }
  .pop-legend { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 14px 10px; }
  .pop-legend .item { display: flex; align-items: center; gap: 4px; font-size: 12px; }
  .pop-legend .dot { width: 8px; height: 8px; border-radius: 50%; }
  .events { max-height: 140px; overflow-y: auto; padding: 6px 14px 10px; }
  .events .ev { color: var(--dim); font-size: 11px; padding: 1px 0; line-height: 1.4; }
  .events .ev.kill { color: var(--red); }
  .events .ev.birth { color: var(--green); }
  .events .ev.share { color: var(--cyan); }
  .inspector { flex: 1; overflow-y: auto; padding: 0 14px 14px; }
  .inspector .empty { color: var(--dim); font-style: italic; padding: 20px 0; text-align: center; }
  .inspector .ent-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .inspector .ent-char { font-size: 24px; font-weight: 700; width: 36px; text-align: center; }
  .inspector .ent-info .name { font-size: 14px; font-weight: 700; }
  .inspector .ent-info .sub { color: var(--dim); font-size: 12px; }
  .bar-wrap { margin: 4px 0; }
  .bar-label { font-size: 11px; color: var(--dim); display: flex; justify-content: space-between; }
  .bar-track { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 2px; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.2s; }
  .traits-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 11px; margin: 6px 0; }
  .traits-grid .trait { display: flex; justify-content: space-between; }
  .traits-grid .trait-name { color: var(--dim); }
  .mem-list { margin-top: 6px; }
  .mem-item { display: flex; align-items: flex-start; gap: 6px; padding: 3px 0; font-size: 11px; border-bottom: 1px solid var(--border); }
  .mem-icon { width: 16px; text-align: center; flex-shrink: 0; font-size: 10px; padding-top: 1px; }
  .mem-icon.danger { color: var(--red); }
  .mem-icon.food { color: var(--green); }
  .mem-icon.social { color: var(--accent); }
  .mem-icon.migration { color: var(--yellow); }
  .mem-icon.mate { color: var(--magenta); }
  .mem-body { flex: 1; }
  .mem-type { font-weight: 600; }
  .mem-desc { color: var(--dim); font-size: 10px; }
  .mem-bar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 2px; overflow: hidden; }
  .mem-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>SimLife</h1>
    <span class="stat">Tick <b id="hTick">0</b></span>
    <span class="stat">Day <b id="hDay">0</b></span>
    <span class="stat" id="hSeason">Spring</span>
    <span class="stat" id="hTime">Day</span>
    <span class="stat">Pop <b id="hPop">0</b></span>
    <div class="controls">
      <button id="btnPause" onclick="togglePause()">Pause</button>
      <button onclick="resetSim()">Reset</button>
      <button id="btnReplay" onclick="toggleReplayMode()" title="Enable replay recording">Replay</button>
      <button id="btnObserve" onclick="toggleObserveMode()" title="Observe entity decisions">Observe</button>
      <label>Speed</label>
      <select id="speedSel" onchange="setSpeed(this.value)">
        <option value="200">Slow</option>
        <option value="80" selected>Normal</option>
        <option value="30">Fast</option>
        <option value="5">Turbo</option>
      </select>
    </div>
  </div>
  <div class="replay-bar" id="replayBar">
    <span class="replay-label">REPLAY</span>
    <button id="replayPlayBtn" onclick="replayPlayPause()" title="Play/Pause replay">Play</button>
    <button onclick="replayStep(-1)" title="Step back">&lt;</button>
    <button onclick="replayStep(1)" title="Step forward">&gt;</button>
    <input type="range" id="replaySlider" min="0" max="0" value="0" oninput="replaySeek(parseInt(this.value))">
    <span class="replay-tick" id="replayTickLabel">Tick 0 / 0</span>
    <button onclick="replayExport()" title="Export replay as JSON">Export</button>
  </div>
  <div class="main">
    <div class="world-wrap">
      <canvas id="worldCanvas"></canvas>
      <div class="world-tooltip" id="tooltip"></div>
      <div class="legend" id="legend"></div>
    </div>
    <div class="chart-wrap" style="display:flex;gap:0;flex-direction:column;">
      <div style="display:flex;flex:1;min-height:0;">
        <div style="flex:1;">
          <h3>Population Over Time</h3>
          <canvas id="popCanvas"></canvas>
        </div>
        <div style="flex:1;">
          <h3>Memory Stats Over Time</h3>
          <canvas id="memCanvas"></canvas>
        </div>
      </div>
    </div>
  </div>
  <div class="sidebar">
    <div class="section">
      <h3>Population</h3>
      <div class="pop-legend" id="popLegend"></div>
    </div>
    <div class="section">
      <h3>Events</h3>
      <div class="events" id="eventLog"></div>
    </div>
    <div class="section" style="border-bottom:none;">
      <h3>Entity Inspector</h3>
      <div class="inspector" id="inspector">
        <div class="empty">Click any creature to inspect its memories.</div>
      </div>
    </div>
    <div class="section observer-panel" id="observerPanel">
      <h3>Observer Timeline</h3>
      <div class="observer-summary" id="observerSummary"></div>
      <div class="observer-energy-bar">
        <div class="bar-label"><span>Observed Energy</span><span id="obsEnergyLabel">0/0</span></div>
        <div class="bar-track"><div class="bar-fill" id="obsEnergyBar" style="width:0%;background:#3fb950"></div></div>
      </div>
      <div class="observer-timeline" id="observerTimeline"></div>
    </div>
  </div>
</div>

<script>
// ================================================================
// SimLife — Pure client-side simulation with memory
// ================================================================

const SPECIES_COLORS = {
  RABBIT: '#3fb950', DEER: '#d29922', WOLF: '#f85149',
  FOX: '#bc8cff', OWL: '#39d353',
};
const TERRAIN_BASE = { 1: [26,35,50], 2: [10,22,40], 3: [13,40,24], 4: [42,26,10] };
const TERRAIN_FOOD = { 1: [30,58,30], 2: [10,30,58], 3: [13,58,26], 4: [58,42,10] };

// ── Seeded Random ────────────────────────────────────────────────
class RNG {
  constructor(seed) { this.s = seed | 0 || 1; }
  next() { this.s ^= this.s << 13; this.s ^= this.s >> 17; this.s ^= this.s << 5; return ((this.s >>> 0) / 4294967296); }
  range(a, b) { return a + this.next() * (b - a); }
  irange(a, b) { return Math.floor(this.range(a, b)); }
  gauss(m, s) { let u = 0, v = 0; while (u === 0) u = this.next(); v = this.next(); return m + s * Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
}

// ── Terrain generation ───────────────────────────────────────────
function genTerrain(w, h, rng) {
  let raw = Array.from({length: h}, () => Array.from({length: w}, () => rng.next()));
  for (let pass = 0; pass < 4; pass++) {
    const n = raw.map(r => [...r]);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      let sum = 0, cnt = 0;
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
        const ny = y+dy, nx = x+dx;
        if (ny >= 0 && ny < h && nx >= 0 && nx < w) { sum += raw[ny][nx]; cnt++; }
      }
      n[y][x] = sum / cnt;
    }
    raw = n;
  }
  return raw.map(row => row.map(v => v < 0.25 ? 2 : v < 0.55 ? 1 : v < 0.80 ? 3 : 4));
}

// ── World ────────────────────────────────────────────────────────
const W = 50, H = 25;
const SEASONS = ['Spring', 'Summer', 'Autumn', 'Winter'];
const SEASON_FOOD = [1.2, 1.0, 0.7, 0.3];
const TERRAIN_FOOD_MAX = { 1: 5, 2: 0, 3: 10, 4: 8 };
const TERRAIN_FOOD_RATE = { 1: 0.15, 2: 0, 3: 0.30, 4: 0.10 };
const TERRAIN_MOVE_COST = { 1: 1, 2: 999, 3: 1.5, 4: 2.0 };
const DAY_LEN = 40;

let rng = new RNG(Date.now());
let terrain, food, entities = [], tick = 0, day = 0, season = 0, tod = 0;
let selectedId = null, paused = false, tickInterval = null, speed = 80;
const popHistory = { RABBIT: [], DEER: [], WOLF: [], FOX: [], OWL: [] };
const memHist = { avgStrength: [], avgCount: [], food: [], danger: [], social: [], migration: [] };
let eventLog = [];

function initWorld() {
  rng = new RNG(Date.now());
  terrain = genTerrain(W, H, rng);
  food = Array.from({length: H}, (_, y) =>
    Array.from({length: W}, (_, x) => terrain[y][x] === 2 ? 0 : rng.range(0, TERRAIN_FOOD_MAX[terrain[y][x]] * 0.6))
  );
  entities = [];
  tick = 0; day = 0; season = 0; tod = 0;
  eventLog = [];
  Object.keys(popHistory).forEach(k => popHistory[k] = []);
  Object.keys(memHist).forEach(k => memHist[k] = []);
  Entity._nextId = 0;

  const configs = [
    ['RABBIT', 15], ['DEER', 8], ['WOLF', 5], ['FOX', 4], ['OWL', 3]
  ];
  for (const [sp, cnt] of configs) {
    for (let i = 0; i < cnt; i++) {
      let x, y, att = 0;
      do { x = rng.irange(1, W-1); y = rng.irange(1, H-1); att++; } while (terrain[y][x] === 2 && att < 50);
      if (terrain[y][x] !== 2) entities.push(new Entity(sp, x, y, rng));
    }
  }
  initPheromones();
  initColonies();
}

// ── Memory System ────────────────────────────────────────────────
class Memory {
  constructor(type, content, valence = 0) {
    this.type = type; this.content = content;
    this.strength = 1.0; this.valence = Math.max(-1, Math.min(1, valence));
    this.reinforced = 0; this.createdTick = tick;
  }
  decay(rate) {
    const eff = rate * (1.0 - 0.5 * Math.abs(this.valence));
    this.strength *= 1.0 - eff;
  }
  get alive() { return this.strength > 0.05; }
}

class MemoryBank {
  constructor(intelligence) {
    this.capacity = 12 + Math.round(intelligence * 4);
    this.memories = [];
    this.decayRate = 0.035 / (0.5 + intelligence * 0.3);
  }
  encode(type, content, valence = 0) {
    const sim = new Memory(type, content, valence);
    // find similar to reinforce
    for (const m of this.memories) {
      if (m.type !== type) continue;
      const c1 = m.content, c2 = content;
      if (c1.x !== undefined && c1.x === c2.x && c1.y === c2.y) { m.strength = Math.min(1, m.strength + 0.3); m.reinforced++; return m; }
      if (c1.entity_id !== undefined && c1.entity_id === c2.entity_id) { m.strength = Math.min(1, m.strength + 0.3); m.reinforced++; return m; }
    }
    if (this.memories.length >= this.capacity) {
      this.memories.sort((a, b) => a.strength - b.strength);
      this.memories.shift();
    }
    this.memories.push(sim);
    return sim;
  }
  recall(type, minStr = 0.1) { return this.memories.filter(m => m.type === type && m.strength >= minStr).sort((a, b) => b.strength - a.strength); }
  fearAt(x, y) {
    const d = this.recall('SPATIAL_DANGER', 0.15);
    const near = d.filter(m => Math.abs(m.content.x - x) + Math.abs(m.content.y - y) <= 8);
    return near.length ? near.reduce((s, m) => s + m.strength * Math.abs(m.valence), 0) / near.length : 0;
  }
  tick_() { for (const m of this.memories) m.decay(this.decayRate); this.memories = this.memories.filter(m => m.alive); }
  shareWith(other, maxN = 2) {
    const sorted = [...this.memories].sort((a, b) => b.strength - a.strength);
    let shared = 0;
    for (const m of sorted) {
      if (shared >= maxN) break;
      if (m.type === 'MATE') continue;
      if (other.encode(m.type, {...m.content}, m.valence)) shared++;
    }
    return shared;
  }
}

// ── Entity ───────────────────────────────────────────────────────
const SP_CFG = {
  RABBIT: { char: 'r', name: 'Rabbit', maxE: 80, maxAge: 300, spd: 2, str: 0.3, int: 0.6, soc: 0.7, con: 0.5, diet: 'herb', repE: 55, repCh: 0.03 },
  DEER:   { char: 'D', name: 'Deer',   maxE: 120, maxAge: 500, spd: 1.5, str: 0.5, int: 0.8, soc: 0.8, con: 0.7, diet: 'herb', repE: 70, repCh: 0.02 },
  WOLF:   { char: 'W', name: 'Wolf',   maxE: 150, maxAge: 600, spd: 1.8, str: 1.0, int: 1.2, soc: 0.9, con: 0.8, diet: 'carn', repE: 90, repCh: 0.015 },
  FOX:    { char: 'F', name: 'Fox',    maxE: 100, maxAge: 450, spd: 2.2, str: 0.6, int: 1.4, soc: 0.4, con: 0.6, diet: 'omni', repE: 60, repCh: 0.025 },
  OWL:    { char: 'O', name: 'Owl',    maxE: 90, maxAge: 550, spd: 1.2, str: 0.5, int: 1.6, soc: 0.3, con: 0.5, diet: 'omni', repE: 55, repCh: 0.02 },
};

class Entity {
  static _nextId = 0;
  constructor(species, x, y, rng, parentTraits) {
    this.id = ++Entity._nextId;
    this.species = species;
    const c = SP_CFG[species];
    this.char = c.char; this.diet = c.diet; this.maxAge = c.maxAge;
    this.repE = c.repE; this.repCh = c.repCh;
    this.x = x; this.y = y; this.rng = rng;
    this.traits = {};
    for (const k of ['str','int','soc','con','spd']) {
      const base = parentTraits ? (parentTraits[k] || c[k]) : c[k];
      this.traits[k] = Math.max(0.1, base * (1 + rng.gauss(0, 0.08)));
    }
    this.energy = c.maxE; this.maxE = c.maxE; this.age = 0; this.health = 1; this.alive = true;
    this.memory = new MemoryBank(this.traits.int);
    this.kills = 0; this.children = 0; this.foodEaten = 0; this.sharedMem = 0;
    this._wanderCd = 0;
  }
  dist(o) { return Math.abs(this.x - o.x) + Math.abs(this.y - o.y); }
  sign(v) { return v > 0 ? 1 : v < 0 ? -1 : 0; }
  passable(x, y) { return x >= 0 && x < W && y >= 0 && y < H && terrain[y][x] !== 2; }
  tryMove(dx, dy) {
    const nx = this.x + dx, ny = this.y + dy;
    if (!this.passable(nx, ny)) return false;
    const cost = TERRAIN_MOVE_COST[terrain[ny][nx]] * 1.5;
    if (this.energy < cost) return false;
    this.x = nx; this.y = ny; this.energy -= cost;
    return true;
  }
  moveToward(tx, ty) {
    const dx = this.sign(tx - this.x), dy = this.sign(ty - this.y);
    for (const [ddx, ddy] of [[dx,dy],[dx,0],[0,dy],[-dx,dy],[dx,-dy]]) {
      if ((ddx || ddy) && this.tryMove(ddx, ddy)) return true;
    }
    return false;
  }
  isThreat(o) {
    if (this.diet === 'herb') return (o.diet === 'carn' || o.diet === 'omni') && o.traits.str > this.traits.str * 0.5;
    if (this.diet === 'carn') return o.species === 'WOLF' && o.id !== this.id;
    return o.species === 'WOLF' && o.traits.str > this.traits.str;
  }
  isPrey(o) {
    if (this.diet === 'carn') return o.diet === 'herb';
    if (this.diet === 'omni') return o.diet === 'herb' && o.traits.str < this.traits.str;
    return false;
  }
  isNight() { return tod < 0.2 || tod > 0.8; }

  act(nearby) {
    this.age++;
    this.energy -= 0.5;
    if (this.age > this.maxAge * 0.7) this.health -= 0.002;
    if (this.age > this.maxAge * 0.9) this.energy -= 1;
    if (this.isNight() && this.species !== 'OWL') this.energy -= 0.3;
    if (this.energy <= 0 || this.health <= 0) { this.alive = false; if (observeEnabled && observeTargetId === this.id) addObsEvent('DEATH', `${this.species}#${this.id} died at (${this.x},${this.y})`, `Energy=${this.energy.toFixed(1)}, Health=${this.health.toFixed(2)}, Age=${this.age}`); return; }

    // Encode memories
    this._updateMemory(nearby);
    // Decide
    this._decide(nearby);
  }

  _updateMemory(nearby) {
    const c = food[this.y][this.x];
    if (c > 1) this.memory.encode('SPATIAL_FOOD', {x: this.x, y: this.y, q: c}, 0.3);
    // Nearby food
    for (let dy = -5; dy <= 5; dy++) for (let dx = -5; dx <= 5; dx++) {
      const nx = this.x+dx, ny = this.y+dy;
      if (nx >= 0 && nx < W && ny >= 0 && ny < H && food[ny][nx] > 3) {
        this.memory.encode('SPATIAL_FOOD', {x: nx, y: ny, q: food[ny][nx]}, 0.2);
      }
    }
    // Territory
    let density = 0, cnt = 0;
    for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
      const nx = this.x+dx, ny = this.y+dy;
      if (nx >= 0 && nx < W && ny >= 0 && ny < H) { density += food[ny][nx]; cnt++; }
    }
    density /= (cnt || 1);
    if (density > 2.5) this.memory.encode('MIGRATION', {x: this.x, y: this.y, density}, 0.4);

    for (const o of nearby) {
      if (o.id === this.id || !o.alive) continue;
      if (!this.memory.recall('SOCIAL_ENEMY', 0.2).find(m => m.content.entity_id === o.id) &&
          !this.memory.recall('SOCIAL_FRIEND', 0.2).find(m => m.content.entity_id === o.id)) {
        this.memory.encode('SOCIAL_FRIEND', {entity_id: o.id, species: o.species, lx: o.x, ly: o.y}, 0.1);
      }
    }
  }

  _obs(type, desc, reasoning) {
    if (observeEnabled && observeTargetId === this.id) {
      addObsEvent(type, desc, reasoning);
    }
  }

  _decide(nearby) {
    // 1. Flee
    const threats = nearby.filter(o => o.id !== this.id && this.isThreat(o) && this.dist(o) < 4 + Math.round(this.traits.int * 2));
    if (threats.length || this.memory.fearAt(this.x, this.y) > 0.3) {
      if (threats.length) {
        const worst = threats.reduce((a, b) => a.traits.str < b.traits.str ? a : b);
        this.memory.encode('SPATIAL_DANGER', {x: worst.x, y: worst.y, tid: worst.id}, -0.7);
        this._obs('ACTION', `Fleeing ${worst.species}#${worst.id} at (${worst.x},${worst.y})`, `Threat detected: STR=${worst.traits.str.toFixed(2)}, dist=${this.dist(worst)}`);
        this.tryMove(this.sign(this.x - worst.x), this.sign(this.y - worst.y));
        return;
      }
      // Flee from remembered danger
      const mig = this.memory.recall('MIGRATION', 0.1).find(m => Math.abs(m.content.x-this.x)+Math.abs(m.content.y-this.y) > 3);
      if (mig) {
        this._obs('DECISION', `Fleeing remembered danger, heading to (${mig.content.x},${mig.content.y})`, `Fear score=${this.memory.fearAt(this.x, this.y).toFixed(2)}`);
        this.moveToward(mig.content.x, mig.content.y);
      }
      return;
    }

    // 2. Hunt
    if (this.diet === 'carn' || this.diet === 'omni') {
      const prey = nearby.filter(o => this.isPrey(o) && this.dist(o) < 6);
      if (prey.length) {
        const target = prey.reduce((a, b) => this.dist(a) < this.dist(b) ? a : b);
        if (this.dist(target) <= 1) {
          const dmg = this.traits.str * 2 * (this.energy / this.maxE) * (0.8 + this.rng.next() * 0.4);
          target.energy -= dmg * 3; target.health -= dmg * 0.1;
          this.memory.encode('SPATIAL_DANGER', {x: target.x, y: target.y, tid: this.id}, -0.8);
          if (target.energy <= 0 || target.health <= 0) {
            target.alive = false; this.energy = Math.min(this.maxE, this.energy + 40); this.kills++;
            this._obs('ACTION', `Killed ${target.species}#${target.id}`, `DMG=${(dmg*3).toFixed(1)}, +40 energy`);
            eventLog.push({ type: 'kill', text: `${this.char}#${this.id} killed ${target.char}#${target.id}` });
          } else {
            this._obs('ACTION', `Attacked ${target.species}#${target.id}`, `DMG=${(dmg*3).toFixed(1)}, target HP=${Math.round(target.health*100)}%`);
          }
          return;
        }
        this._obs('DECISION', `Hunting ${target.species}#${target.id} (dist=${this.dist(target)})`, `STR=${this.traits.str.toFixed(2)}, pursuing`);
        this.moveToward(target.x, target.y);
        return;
      }
    }

    // 3. Forage
    const cell = food[this.y][this.x];
    if (cell > 0.5 && this.energy < this.maxE * 0.9) {
      const amt = Math.min(cell, 3);
      food[this.y][this.x] -= amt;
      this.energy = Math.min(this.maxE, this.energy + amt * 15);
      this.foodEaten += amt;
      this.memory.encode('SPATIAL_FOOD', {x: this.x, y: this.y, q: cell}, 0.5);
      this._obs('ACTION', `Ate ${amt.toFixed(1)} food at (${this.x},${this.y})`, `Energy ${Math.round(this.energy)}/${this.maxE}`);
      return;
    }
    if (this.energy < this.maxE * 0.7) {
      const foods = this.memory.recall('SPATIAL_FOOD', 0.05).filter(m =>
        Math.abs(m.content.x-this.x)+Math.abs(m.content.y-this.y) <= 15
      );
      if (foods.length) {
        const best = foods.reduce((a, b) => (a.content.q*a.strength > b.content.q*b.strength) ? a : b);
        if (best.content.x !== this.x || best.content.y !== this.y) {
          this._obs('DECISION', `Moving to remembered food at (${best.content.x},${best.content.y})`, `Memory strength=${best.strength.toFixed(2)}, food quality=${best.content.q?.toFixed(1)}`);
          this.moveToward(best.content.x, best.content.y);
          return;
        }
      }
    }

    // 4. Socialize
    if (this.traits.soc > 0.3) {
      const allies = nearby.filter(o => o.id !== this.id && o.alive && this.dist(o) <= 2 &&
        !this.memory.recall('SOCIAL_ENEMY', 0.3).find(m => m.content.entity_id === o.id));
      if (allies.length) {
        const target = allies[this.rng.irange(0, allies.length)];
        const shared = this.memory.shareWith(target.memory, 2);
        this.sharedMem += shared; target.sharedMem += shared;
        if (shared > 0) {
          this._obs('ACTION', `Shared ${shared} memories with ${target.species}#${target.id}`, `SOC=${this.traits.soc.toFixed(2)}, both have ${shared} common memories`);
          eventLog.push({ type: 'share', text: `${this.char}#${this.id} shared ${shared} mem with ${target.char}#${target.id}` });
        }
        return;
      }
    }

    // 5. Reproduce
    if (this.energy > this.repE) {
      const mates = nearby.filter(o => o.species === this.species && o.id !== this.id && o.alive && o.energy > o.repE && this.dist(o) <= 3);
      if (mates.length && this.rng.next() < this.repCh) {
        const mate = mates[this.rng.irange(0, mates.length)];
        const cost = this.repE * 0.4;
        this.energy -= cost; mate.energy -= cost;
        const smarter = this.traits.int > mate.traits.int ? this : mate;
        const child = new Entity(this.species, this.x + this.rng.irange(-1,1), this.y + this.rng.irange(-1,1), this.rng, smarter.traits);
        if (!child.passable(child.x, child.y)) { child.x = this.x; child.y = this.y; }
        child.energy = child.maxE * 0.6;
        entities.push(child);
        this.children++; mate.children++;
        this._obs('ACTION', `Reproduced with ${mate.species}#${mate.id} -> child #${child.id}`, `Parent INT=${smarter.traits.int.toFixed(2)}, child at (${child.x},${child.y})`);
        eventLog.push({ type: 'birth', text: `New ${child.char}#${child.id} born at (${child.x},${child.y})` });
        return;
      }
    }

    // 6. Migrate / Explore
    const mig = this.memory.recall('MIGRATION', 0.1).find(m => Math.abs(m.content.x-this.x)+Math.abs(m.content.y-this.y) > 3);
    if (mig && this.energy < this.maxE * 0.8) {
      this._obs('DECISION', `Migrating to (${mig.content.x},${mig.content.y})`, `Memory density=${mig.content.density?.toFixed(1)}, strength=${mig.strength.toFixed(2)}`);
      this.moveToward(mig.content.x, mig.content.y);
      return;
    }

    // 7. Wander
    if (this._wanderCd > 0) { this._wanderCd--; this.tryMove(this.rng.irange(-1,1), this.rng.irange(-1,1)); return; }
    this._wanderCd = this.rng.irange(3, 8);
    this.tryMove(this.rng.irange(-1,1), this.rng.irange(-1,1));
  }
}

// ── Pheromone System ──────────────────────────────────────────
const PHER_DECAY = 0.05;
const PHER_MAX = 10.0;
let pheromones = []; // pheromones[y][x] = { food: 0, danger: 0, home: 0 }
function initPheromones() {
  pheromones = Array.from({length: H}, () => Array.from({length: W}, () => ({food:0,danger:0,home:0})));
}
function pherDeposit(x, y, type, amt) {
  if (x>=0 && x<W && y>=0 && y<H) { pheromones[y][x][type] = Math.min(PHER_MAX, pheromones[y][x][type] + amt); }
}
function pherGet(x, y, type) { return (x>=0 && x<W && y>=0 && y<H) ? pheromones[y][x][type] : 0; }
function pherGradient(x, y, type) {
  let bestDx=0, bestDy=0, bestV = pherGet(x,y,type);
  for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++) {
    if (!dx && !dy) continue;
    const v = pherGet(x+dx,y+dy,type);
    if (v > bestV) { bestV=v; bestDx=dx; bestDy=dy; }
  }
  return [bestDx, bestDy];
}
function pherTick() {
  for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
    const c = pheromones[y][x];
    for (const k of ['food','danger','home']) { c[k] *= (1-PHER_DECAY); if (c[k]<0.01) c[k]=0; }
  }
}

// ── Colony System ────────────────────────────────────────────────
let colonies = [];
let antIdCounter = 0;
let colonyIdCounter = 0;

class Ant {
  constructor(x, y, colony) {
    this.id = ++antIdCounter;
    this.x = x; this.y = y; this.colony = colony;
    this.alive = true; this.age = 0; this.maxAge = 200 + rng.irange(0,100);
    this.energy = 60; this.maxE = 60;
    this.carryingFood = 0; this.maxCarry = 5;
    this._returnHome = false; this._stepsNoFood = 0; this._maxExplore = 30 + rng.irange(0,20);
    this._wanderCd = 0;
    this.memory = new MemoryBank(0.8);
    this.memory.capacity = 8;
  }
  passable(x,y) { return x>=0 && x<W && y>=0 && y<H && terrain[y][x]!==2; }
  tryMove(dx,dy) {
    const nx=this.x+dx, ny=this.y+dy;
    if (!this.passable(nx,ny)) return false;
    const cost = TERRAIN_MOVE_COST[terrain[ny][nx]] * 0.8;
    if (this.energy < cost) return false;
    this.x=nx; this.y=ny; this.energy-=cost; return true;
  }
  sign(v) { return v>0?1:v<0?-1:0; }
  workTick() {
    if (!this.alive) return;
    this.age++; this.energy -= 0.3;
    if (this.energy<=0 || this.age>this.maxAge) { this.alive=false; return; }
    const atNest = Math.abs(this.x-this.colony.nestX)<=1 && Math.abs(this.y-this.colony.nestY)<=1;
    const cellFood = food[this.y][this.x];
    // Carrying food -> return home
    if (this.carryingFood > 0) {
      this._returnHome = true;
      pherDeposit(this.x, this.y, 'food', 2.0 * (this.carryingFood/this.maxCarry));
      if (atNest) { this.colony.foodReserves = Math.min(200, this.colony.foodReserves + this.carryingFood); this.colony.totalGathered += this.carryingFood; this.carryingFood=0; this._returnHome=false; this._stepsNoFood=0; this._maxExplore=30+rng.irange(0,20); return; }
      const [gx,gy] = pherGradient(this.x, this.y, 'home');
      if (gx||gy) this.tryMove(gx,gy); else this.tryMove(this.sign(this.colony.nestX-this.x), this.sign(this.colony.nestY-this.y));
      return;
    }
    // At food -> pick up
    if (cellFood > 1.0 && !this._returnHome) {
      const pick = Math.min(cellFood, this.maxCarry);
      if (pick > 0.5) { food[this.y][this.x] -= pick; this.carryingFood=pick; this.energy=Math.min(this.maxE, this.energy+pick*3); pherDeposit(this.x,this.y,'food',4.0); return; }
    }
    // Danger -> avoid
    const dangerHere = pherGet(this.x,this.y,'danger');
    if (dangerHere > 0.5) {
      pherDeposit(this.x,this.y,'danger',1.5);
      // Flee from danger center
      let bx=-1,by=-1,bv=0;
      for (let dy=-3;dy<=3;dy++) for (let dx=-3;dx<=3;dx++) { const v=pherGet(this.x+dx,this.y+dy,'danger'); if(v>bv){bv=v;bx=this.x+dx;by=this.y+dy;} }
      if (bx>=0) { this.tryMove(this.sign(this.x-bx), this.sign(this.y-by)); return; }
    }
    // Food trail -> follow
    const [fdx,fdy] = pherGradient(this.x,this.y,'food');
    const fs = pherGet(this.x,this.y,'food');
    if (fs>0.1 && (fdx||fdy)) { this.tryMove(fdx,fdy); this._stepsNoFood++; if(this._stepsNoFood>this._maxExplore) { this._wanderCd=0; this._explore(); } return; }
    // Explore
    this._explore();
    pherDeposit(this.x,this.y,'home',0.3);
    this._stepsNoFood++;
  }
  _explore() {
    if (this._wanderCd>0) { this._wanderCd--; this.tryMove(rng.irange(-1,1),rng.irange(-1,1)); return; }
    this._wanderCd=rng.irange(2,5);
    if (rng.next()<0.3) {
      let bx=this.x,by=this.y,bs=-1;
      for(let i=0;i<5;i++) { const rx=this.x+rng.irange(-4,4),ry=this.y+rng.irange(-4,4); if(rx>=0&&rx<W&&ry>=0&&ry<H&&terrain[ry][rx]!==2){const s=food[ry][rx]*0.5;if(s>bs){bs=s;bx=rx;by=ry;}} }
      this.tryMove(this.sign(bx-this.x),this.sign(by-this.y));
    } else this.tryMove(rng.irange(-1,1),rng.irange(-1,1));
  }
}

class Colony {
  constructor(nestX, nestY) {
    this.id = ++colonyIdCounter;
    this.nestX = nestX; this.nestY = nestY;
    this.alive = true; this.age = 0;
    this.foodReserves = 50; this.totalGathered = 0;
    this.queenAlive = true; this.queenAge = 0;
    this.queenMemories = 0;
    this.workers = [];
    for (let i=0; i<8; i++) this._spawnWorker();
  }
  _spawnWorker() {
    const x = this.nestX + rng.irange(-2,2), y = this.nestY + rng.irange(-2,2);
    if (x>=0 && x<W && y>=0 && y<H && terrain[y][x]!==2) this.workers.push(new Ant(x,y,this));
  }
  tick() {
    this.age++;
    if (!this.alive) return;
    // Queen stays alive as long as colony has food
    if (this.queenAlive) {
      this.queenAge++;
      if (this.foodReserves>5) { this.foodReserves-=0.5; }
      else { this.queenAlive = false; }
    }
    // Worker ticks
    for (const w of this.workers) w.workTick();
    this.workers = this.workers.filter(w => w.alive);
    // Auto-spawn
    if (this.queenAlive && this.foodReserves>30 && this.workers.length<25 && this.age%10===0 && rng.next()<0.4) {
      this.foodReserves -= 8;
      this._spawnWorker();
    }
    if (!this.queenAlive && this.workers.length===0) this.alive = false;
  }
}

function initColonies() {
  colonies = []; colonyIdCounter = 0; antIdCounter = 0;
  const numC = W*H > 400 ? 2 : 1;
  for (let i=0; i<numC; i++) {
    for (let att=0; att<100; att++) {
      const cx=rng.irange(2,W-3), cy=rng.irange(2,H-3);
      if (terrain[cy][cx]===3) { colonies.push(new Colony(cx,cy)); eventLog.push({type:'share',text:`Colony#${colonyIdCounter} at (${cx},${cy})`}); break; }
    }
  }
}

// ── Simulation Step ──────────────────────────────────────────────
function simStep() {
  tick++;
  tod += 1/DAY_LEN;
  if (tod >= 1) { tod -= 1; day++; if (day % 120 === 0) season = (season + 1) % 4; }
  // Food regrowth
  const sf = SEASON_FOOD[season];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (terrain[y][x] === 2) continue;
    let g = TERRAIN_FOOD_RATE[terrain[y][x]] * sf;
    if (!(tod < 0.2 || tod > 0.8)) g *= 1.5;
    food[y][x] = Math.min(TERRAIN_FOOD_MAX[terrain[y][x]], food[y][x] + g);
  }
  // Entities
  const toRemove = new Set();
  for (const e of entities) {
    if (!e.alive) { toRemove.add(e.id); continue; }
    const nearby = entities.filter(o => o.alive && o.id !== e.id && e.dist(o) < 12);
    e.act(nearby);
    if (!e.alive) toRemove.add(e.id);
  }
  entities = entities.filter(e => !toRemove.has(e.id));
  for (const e of entities) e.memory.tick_();
  // Colony ticks
  for (const c of colonies) { if (c.alive) c.tick(); }
  colonies = colonies.filter(c => c.alive);
  pherTick();
  // Record pop
  const pop = {};
  for (const e of entities) pop[e.species] = (pop[e.species]||0) + 1;
  const totalAnts = colonies.reduce((s,c) => s + c.workers.length, 0);
  const totalQueens = colonies.reduce((s,c) => s + (c.queenAlive?1:0), 0);
  if (totalAnts) pop['ANT'] = totalAnts;
  if (totalQueens) pop['QUEEN'] = totalQueens;
  for (const sp of Object.keys(popHistory)) { if (!(sp in popHistory)) popHistory[sp]=[]; popHistory[sp].push(pop[sp] || 0); }
  // Record memory stats
  let totalStr = 0, memCnt = 0;
  const typeCnt = { food: 0, danger: 0, social: 0, migration: 0 };
  for (const e of entities) {
    for (const m of e.memory.memories) {
      totalStr += m.strength; memCnt++;
      if (m.type === 'SPATIAL_FOOD') typeCnt.food++;
      else if (m.type === 'SPATIAL_DANGER') typeCnt.danger++;
      else if (m.type === 'MIGRATION') typeCnt.migration++;
      else typeCnt.social++;
    }
  }
  const ne = Math.max(entities.length, 1);
  memHist.avgStrength.push(totalStr / Math.max(memCnt, 1));
  memHist.avgCount.push(memCnt / ne);
  for (const k of Object.keys(typeCnt)) memHist[k].push(typeCnt[k] / ne);
}

// ── Rendering ────────────────────────────────────────────────────
const worldCanvas = document.getElementById('worldCanvas');
const wCtx = worldCanvas.getContext('2d');
const popCanvas = document.getElementById('popCanvas');
const pCtx = popCanvas.getContext('2d');
const memCanvas = document.getElementById('memCanvas');
const mCtx = memCanvas.getContext('2d');
const tooltip = document.getElementById('tooltip');
const inspector = document.getElementById('inspector');

function render() {
  renderHeader();
  renderWorld();
  renderChart();
  renderMemChart();
  renderPopLegend();
  renderEvents();
  if (selectedId) renderInspector(selectedId);
}

function renderHeader() {
  document.getElementById('hTick').textContent = tick;
  document.getElementById('hDay').textContent = day;
  document.getElementById('hSeason').textContent = SEASONS[season];
  const totalAntsH = colonies.reduce((s,c) => s + c.workers.length, 0);
  document.getElementById('hPop').textContent = entities.length + (totalAntsH ? `+${totalAntsH}a` : '');
  document.getElementById('hTime').textContent = (tod < 0.2 || tod > 0.8) ? 'Night' : 'Day';
  const btn = document.getElementById('btnPause');
  btn.textContent = paused ? 'Play' : 'Pause';
  btn.className = paused ? 'active' : '';
}

function renderWorld() {
  const cw = worldCanvas.parentElement.clientWidth;
  const ch = worldCanvas.parentElement.clientHeight - 4;
  const cell = Math.max(4, Math.min(Math.floor(cw/W), Math.floor(ch/H)));
  worldCanvas.width = W * cell; worldCanvas.height = H * cell;

  const imgData = wCtx.createImageData(W * cell, H * cell);
  const d = imgData.data;
  const isNight = tod < 0.2 || tod > 0.8;

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = terrain[y][x], f = food[y][x];
    const base = TERRAIN_BASE[t], foodC = TERRAIN_FOOD[t];
    const ff = Math.min(1, f / 8) * 0.4;
    let r = base[0] + (foodC[0] - base[0]) * ff;
    let g = base[1] + (foodC[1] - base[1]) * ff;
    let b = base[2] + (foodC[2] - base[2]) * ff;
    if (isNight) { r *= 0.4; g *= 0.4; b *= 0.5; }
    for (let py = 0; py < cell; py++) for (let px = 0; px < cell; px++) {
      const idx = ((y*cell+py)*W*cell + (x*cell+px)) * 4;
      d[idx] = r; d[idx+1] = g; d[idx+2] = b; d[idx+3] = 255;
    }
  }
  wCtx.putImageData(imgData, 0, 0);

  // Pheromone overlay (subtle colored tint on cells with pheromones)
  if (cell >= 3) {
    for (let y=0;y<H;y++) for (let x=0;x<W;x++) {
      const p = pheromones[y][x];
      if (p.danger > 0.3) {
        wCtx.fillStyle = `rgba(248,81,73,${Math.min(0.4, p.danger*0.08)})`;
        wCtx.fillRect(x*cell, y*cell, cell, cell);
      } else if (p.food > 0.3) {
        wCtx.fillStyle = `rgba(63,185,80,${Math.min(0.35, p.food*0.07)})`;
        wCtx.fillRect(x*cell, y*cell, cell, cell);
      } else if (p.home > 0.3) {
        wCtx.fillStyle = `rgba(88,166,255,${Math.min(0.2, p.home*0.04)})`;
        wCtx.fillRect(x*cell, y*cell, cell, cell);
      }
    }
  }

  // Colony nests
  for (const c of colonies) {
    const nx = c.nestX * cell + cell/2, ny = c.nestY * cell + cell/2;
    const nr = Math.max(4, cell * 0.6);
    wCtx.beginPath(); wCtx.arc(nx, ny, nr+2, 0, Math.PI*2);
    wCtx.fillStyle = c.queenAlive ? 'rgba(57,211,83,0.35)' : 'rgba(248,81,73,0.25)';
    wCtx.fill();
    wCtx.beginPath(); wCtx.arc(nx, ny, nr, 0, Math.PI*2);
    wCtx.fillStyle = c.queenAlive ? '#1a5c2a' : '#5c1a1a';
    wCtx.fill();
    wCtx.fillStyle = '#fff'; wCtx.font = `bold ${Math.floor(cell*0.45)}px monospace`;
    wCtx.textAlign = 'center'; wCtx.textBaseline = 'middle';
    wCtx.fillText('N', nx, ny);
  }

  // Ants (small dots)
  for (const c of colonies) {
    for (const a of c.workers) {
      if (!a.alive) continue;
      const ax = a.x * cell + cell/2, ay = a.y * cell + cell/2;
      const ar = Math.max(1.5, cell * 0.2);
      wCtx.beginPath(); wCtx.arc(ax, ay, ar, 0, Math.PI*2);
      wCtx.fillStyle = a.carryingFood > 0 ? '#d29922' : '#39d353';
      wCtx.fill();
    }
  }

  // Entities
  for (const e of entities) {
    const color = SPECIES_COLORS[e.species];
    const cx = e.x * cell + cell/2, cy = e.y * cell + cell/2;
    const r = Math.max(2, cell * 0.35);
    if (e.id === selectedId) { wCtx.beginPath(); wCtx.arc(cx, cy, r+4, 0, Math.PI*2); wCtx.fillStyle = 'rgba(255,255,255,0.25)'; wCtx.fill(); }
    wCtx.beginPath(); wCtx.arc(cx, cy, r, 0, Math.PI*2); wCtx.fillStyle = color; wCtx.fill();
    if (cell >= 12) {
      wCtx.fillStyle = '#000'; wCtx.font = `bold ${Math.floor(cell*0.5)}px monospace`;
      wCtx.textAlign = 'center'; wCtx.textBaseline = 'middle';
      wCtx.fillText(e.char, cx, cy);
    }
  }

  // Legend
  const lg = document.getElementById('legend');
  lg.innerHTML = [
    ['r','Rabbit',SPECIES_COLORS.RABBIT], ['D','Deer',SPECIES_COLORS.DEER],
    ['W','Wolf',SPECIES_COLORS.WOLF], ['F','Fox',SPECIES_COLORS.FOX],
    ['O','Owl',SPECIES_COLORS.OWL],
    ['N','Nest','#1a5c2a'], ['a','Ant','#39d353'],
    ['*','Food trail','#3fb950'], ['!','Danger','#f85149'],
    ['.','grass','#555'], ['~','water','#555'], ['#','forest','#555'], ['^','mountain','#555']
  ].map(([ch,lb,c]) => `<div class="lg"><span class="lg-char" style="color:${c}">${ch}</span><span style="color:var(--dim)">${lb}</span></div>`).join('');
}

function renderChart() {
  const cw = popCanvas.parentElement.clientWidth - 24, ch = 100;
  popCanvas.width = cw; popCanvas.height = ch;
  pCtx.clearRect(0, 0, cw, ch);
  let maxP = 1, maxL = 1;
  for (const arr of Object.values(popHistory)) { maxP = Math.max(maxP, ...arr); maxL = Math.max(maxL, arr.length); }
  maxP = Math.max(maxP + 2, 5);
  for (const [sp, arr] of Object.entries(popHistory)) {
    pCtx.strokeStyle = SPECIES_COLORS[sp]; pCtx.lineWidth = 1.5; pCtx.beginPath();
    for (let i = 0; i < arr.length; i++) {
      const x = (i / (maxL-1||1)) * cw, y = ch - (arr[i]/maxP)*(ch-4) - 2;
      i === 0 ? pCtx.moveTo(x, y) : pCtx.lineTo(x, y);
    }
    pCtx.stroke();
  }
  pCtx.fillStyle = '#8b949e'; pCtx.font = '10px monospace'; pCtx.textAlign = 'left';
  for (let v = 0; v <= maxP; v += Math.ceil(maxP/4)) {
    pCtx.fillText(v, 2, ch - (v/maxP)*(ch-4) - 6);
  }
}

function renderMemChart() {
  const cw = memCanvas.parentElement.clientWidth - 24, ch = 100;
  memCanvas.width = cw; memCanvas.height = ch;
  mCtx.clearRect(0, 0, cw, ch);
  const keys = ['avgStrength', 'food', 'danger', 'social', 'migration'];
  const colors = ['#e6edf3', '#3fb950', '#f85149', '#58a6ff', '#d29922'];
  const labels = ['Avg Str', 'Food', 'Danger', 'Social', 'Migr'];
  let maxV = 0.01, maxL = 1;
  for (const k of keys) { maxV = Math.max(maxV, ...memHist[k]); maxL = Math.max(maxL, memHist[k].length); }
  maxV *= 1.2;
  for (let ki = 0; ki < keys.length; ki++) {
    const arr = memHist[keys[ki]];
    mCtx.strokeStyle = colors[ki]; mCtx.lineWidth = 1.5; mCtx.beginPath();
    for (let i = 0; i < arr.length; i++) {
      const x = (i / (maxL-1||1)) * cw, y = ch - (arr[i]/maxV)*(ch-4) - 2;
      i === 0 ? mCtx.moveTo(x, y) : mCtx.lineTo(x, y);
    }
    mCtx.stroke();
  }
  // Legend
  mCtx.font = '9px sans-serif';
  let lx = 4;
  for (let i = 0; i < labels.length; i++) {
    mCtx.fillStyle = colors[i];
    mCtx.fillRect(lx, 2, 10, 2);
    mCtx.fillText(labels[i], lx + 12, 10);
    lx += mCtx.measureText(labels[i]).width + 20;
  }
}

const POP_COLORS = { ...SPECIES_COLORS, ANT: '#39d353', QUEEN: '#d29922' };
function renderPopLegend() {
  const el = document.getElementById('popLegend');
  const pop = {};
  for (const e of entities) pop[e.species] = (pop[e.species]||0) + 1;
  const totalAnts = colonies.reduce((s,c) => s + c.workers.length, 0);
  const totalQueens = colonies.reduce((s,c) => s + (c.queenAlive?1:0), 0);
  const totalGathered = colonies.reduce((s,c) => s + c.totalGathered, 0);
  if (totalAnts) pop['ANT'] = totalAnts;
  if (totalQueens) pop['QUEEN'] = totalQueens;
  let html = Object.entries(pop).sort((a,b) => b[1]-a[1]).map(([sp,cnt]) =>
    `<div class="item"><span class="dot" style="background:${POP_COLORS[sp]||'#888'}"></span><span style="color:${POP_COLORS[sp]||'#888'}">${sp}</span>: <b>${cnt}</b></div>`
  ).join('');
  // Colony info
  for (const c of colonies) {
    html += `<div style="font-size:11px;color:var(--dim);margin-top:4px;border-top:1px solid var(--border);padding-top:4px;width:100%;">
      Colony#${c.id}: nest(${c.nestX},${c.nestY}) ${c.workers.length} workers food=${Math.round(c.foodReserves)} gathered=${Math.round(c.totalGathered)} Q=${c.queenAlive?'alive':'DEAD'}
    </div>`;

}

worldCanvas.addEventListener('click', ev => {
  const rect = worldCanvas.getBoundingClientRect();
  const cell = worldCanvas.width / W;
  const gx = Math.floor((ev.clientX - rect.left) / cell);
  const gy = Math.floor((ev.clientY - rect.top) / cell);
  const found = entities.find(e => e.x === gx && e.y === gy);
  if (found) { selectedId = found.id; renderInspector(found.id); render(); return; }
  // Check colony nests
  const col = colonies.find(c => c.nestX === gx && c.nestY === gy);
  if (col) { renderColonyInspector(col); render(); }
});

worldCanvas.addEventListener('mousemove', ev => {
  const rect = worldCanvas.getBoundingClientRect();
  const cell = worldCanvas.width / W;
  const gx = Math.floor((ev.clientX - rect.left) / cell);
  const gy = Math.floor((ev.clientY - rect.top) / cell);
  const found = entities.find(e => e.x === gx && e.y === gy);
  if (found) {
    tooltip.style.display = 'block';
    tooltip.style.left = (ev.clientX - rect.left + 12) + 'px';
    tooltip.style.top = (ev.clientY - rect.top - 10) + 'px';
    tooltip.innerHTML = `<div class="tt-name" style="color:${SPECIES_COLORS[found.species]}">${found.species}#${found.id}</div>
      <div class="tt-line">Energy: ${Math.round(found.energy)} HP: ${Math.round(found.health*100)}%</div>
      <div class="tt-line">Memories: ${found.memory.memories.length}/${found.memory.capacity}</div>`;
  } else {
    // Check colony nest
    const col = colonies.find(c => c.nestX === gx && c.nestY === gy);
    if (col) {
      tooltip.style.display = 'block';
      tooltip.style.left = (ev.clientX - rect.left + 12) + 'px';
      tooltip.style.top = (ev.clientY - rect.top - 10) + 'px';
      tooltip.innerHTML = `<div class="tt-name" style="color:#39d353">Colony#${col.id}</div>
        <div class="tt-line">Workers: ${col.workers.length} Food: ${Math.round(col.foodReserves)}</div>

    } else tooltip.style.display = 'none';
  }
});
worldCanvas.addEventListener('mouseleave', () => tooltip.style.display = 'none');

// ── Replay System ──────────────────────────────────────────────
let replayEnabled = false;
let replayFrames = [];  // [{tick, entities:[{id,species,x,y,energy,health,age,memoryCount,traits,...}], food, pop, events, colonies, pheromones, timeOfDay, season, isNight}]
let replayPlaying = false;
let replayIndex = 0;
let replayInterval = null;

function toggleReplayMode() {
  replayEnabled = !replayEnabled;
  const btn = document.getElementById('btnReplay');
  const bar = document.getElementById('replayBar');
  if (replayEnabled) {
    btn.classList.add('active');
    bar.classList.add('visible');
    replayFrames = [];
    replayIndex = 0;
    addReplayFrame();
  } else {
    btn.classList.remove('active');
    bar.classList.remove('visible');
    replayPlaying = false;
    if (replayInterval) { clearInterval(replayInterval); replayInterval = null; }
  }
}

function addReplayFrame() {
  if (!replayEnabled) return;
  const frame = {
    tick: tick,
    day: day,
    season: season,
    tod: tod,
    isNight: tod < 0.2 || tod > 0.8,
    entities: entities.filter(e => e.alive).map(e => ({
      id: e.id, species: e.species, char: e.char,
      x: e.x, y: e.y,
      energy: Math.round(e.energy * 10) / 10,
      health: Math.round(e.health * 1000) / 1000,
      age: e.age, maxAge: e.maxAge,
      traits: { ...e.traits },
      memoryCount: e.memory.memories.length,
      memoryCapacity: e.memory.capacity,
      topMemories: [...e.memory.memories].sort((a,b) => b.strength - a.strength).slice(0, 5).map(m => ({
        type: m.type, strength: Math.round(m.strength * 1000) / 1000,
        valence: Math.round(m.valence * 100) / 100,
        desc: memDesc(m)
      })),
      kills: e.kills, children: e.children,
      foodEaten: Math.round(e.foodEaten * 10) / 10,
      sharedMem: e.sharedMem,
    })),
    colonies: colonies.map(c => ({
      id: c.id, nestX: c.nestX, nestY: c.nestY,
      alive: c.alive, foodReserves: Math.round(c.foodReserves),
      queenAlive: c.queenAlive, queenAge: c.queenAge,
      workers: c.workers.filter(w => w.alive).map(w => ({
        id: w.id, x: w.x, y: w.y,
        energy: Math.round(w.energy), carryingFood: Math.round(w.carryingFood * 10) / 10,
      })),
      totalGathered: Math.round(c.totalGathered),
    })),
    food: food.map(row => row.map(v => Math.round(v * 10) / 10)),
    events: eventLog.slice(-10).map(e => e.text),
    popHistory: JSON.parse(JSON.stringify(popHistory)),
  };
  replayFrames.push(frame);
  // Update slider
  const slider = document.getElementById('replaySlider');
  slider.max = replayFrames.length - 1;
  slider.value = replayFrames.length - 1;
  replayIndex = replayFrames.length - 1;
  updateReplayLabel();
}

function memDesc(m) {
  const c = m.content;
  if (m.type === 'SPATIAL_FOOD') return `food@(${c.x},${c.y}) q=${c.q?.toFixed(0)}`;
  if (m.type === 'SPATIAL_DANGER') return `danger@(${c.x},${c.y})`;
  if (m.type === 'SOCIAL_FRIEND') return `friend#${c.entity_id}`;
  if (m.type === 'SOCIAL_ENEMY') return `enemy#${c.entity_id}`;
  if (m.type === 'MIGRATION') return `migrate@(${c.x},${c.y}) d=${c.density?.toFixed(0)}`;
  if (m.type === 'MATE') return `mate@(${c.x},${c.y})`;
  return JSON.stringify(c).slice(0, 40);
}

function replaySeek(idx) {
  if (!replayFrames.length) return;
  replayIndex = Math.max(0, Math.min(replayFrames.length - 1, idx));
  document.getElementById('replaySlider').value = replayIndex;
  updateReplayLabel();
  renderReplayFrame(replayFrames[replayIndex]);
}

function replayStep(dir) {
  replaySeek(replayIndex + dir);
}

function replayPlayPause() {
  replayPlaying = !replayPlaying;
  const btn = document.getElementById('replayPlayBtn');
  btn.textContent = replayPlaying ? 'Pause' : 'Play';
  btn.classList.toggle('active', replayPlaying);
  if (replayPlaying) {
    replayInterval = setInterval(() => {
      if (replayIndex < replayFrames.length - 1) {
        replaySeek(replayIndex + 1);
      } else {
        replayPlaying = false;
        document.getElementById('replayPlayBtn').textContent = 'Play';
        document.getElementById('replayPlayBtn').classList.remove('active');
        clearInterval(replayInterval);
      }
    }, 100);
  } else if (replayInterval) {
    clearInterval(replayInterval);
  }
}

function updateReplayLabel() {
  const frame = replayFrames[replayIndex];
  document.getElementById('replayTickLabel').textContent =
    frame ? `Tick ${frame.tick} / ${replayFrames[replayFrames.length-1].tick} (${replayIndex+1}/${replayFrames.length})` : 'No frames';
}

function renderReplayFrame(frame) {
  // Render the world at a past frame
  const cw = worldCanvas.parentElement.clientWidth;
  const ch = worldCanvas.parentElement.clientHeight - 4;
  const cell = Math.max(4, Math.min(Math.floor(cw/W), Math.floor(ch/H)));
  worldCanvas.width = W * cell; worldCanvas.height = H * cell;
  const imgData = wCtx.createImageData(W * cell, H * cell);
  const d = imgData.data;
  const isNight = frame.isNight;

  // Draw terrain + food
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = terrain[y][x], f = frame.food[y][x];
    const base = TERRAIN_BASE[t], foodC = TERRAIN_FOOD[t];
    const ff = Math.min(1, f / 8) * 0.4;
    let r = base[0] + (foodC[0] - base[0]) * ff;
    let g = base[1] + (foodC[1] - base[1]) * ff;
    let b = base[2] + (foodC[2] - base[2]) * ff;
    if (isNight) { r *= 0.4; g *= 0.4; b *= 0.5; }
    for (let py = 0; py < cell; py++) for (let px = 0; px < cell; px++) {
      const idx = ((y*cell+py)*W*cell + (x*cell+px)) * 4;
      d[idx] = r; d[idx+1] = g; d[idx+2] = b; d[idx+3] = 255;
    }
  }
  wCtx.putImageData(imgData, 0, 0);

  // Draw colonies + ants from frame
  for (const c of frame.colonies) {
    const nx = c.nestX * cell + cell/2, ny = c.nestY * cell + cell/2;
    const nr = Math.max(4, cell * 0.6);
    wCtx.beginPath(); wCtx.arc(nx, ny, nr, 0, Math.PI*2);
    wCtx.fillStyle = c.queenAlive ? '#1a5c2a' : '#5c1a1a';
    wCtx.fill();
    wCtx.fillStyle = '#fff'; wCtx.font = `bold ${Math.floor(cell*0.45)}px monospace`;
    wCtx.textAlign = 'center'; wCtx.textBaseline = 'middle';
    wCtx.fillText('N', nx, ny);
    for (const a of c.workers) {
      const ax = a.x * cell + cell/2, ay = a.y * cell + cell/2;
      const ar = Math.max(1.5, cell * 0.2);
      wCtx.beginPath(); wCtx.arc(ax, ay, ar, 0, Math.PI*2);
      wCtx.fillStyle = a.carryingFood > 0 ? '#d29922' : '#39d353';
      wCtx.fill();
    }
  }

  // Draw entities from frame
  for (const e of frame.entities) {
    const color = SPECIES_COLORS[e.species];
    const cx = e.x * cell + cell/2, cy = e.y * cell + cell/2;
    const r = Math.max(2, cell * 0.35);
    if (e.id === selectedId) { wCtx.beginPath(); wCtx.arc(cx, cy, r+4, 0, Math.PI*2); wCtx.fillStyle = 'rgba(255,255,255,0.25)'; wCtx.fill(); }
    wCtx.beginPath(); wCtx.arc(cx, cy, r, 0, Math.PI*2);
    wCtx.fillStyle = color; wCtx.fill();
    if (cell >= 12) {
      wCtx.fillStyle = '#000'; wCtx.font = `bold ${Math.floor(cell*0.5)}px monospace`;
      wCtx.textAlign = 'center'; wCtx.textBaseline = 'middle';
      wCtx.fillText(e.char, cx, cy);
    }
  }

  // Update header
  document.getElementById('hTick').textContent = frame.tick;
  document.getElementById('hDay').textContent = frame.day;
  document.getElementById('hSeason').textContent = SEASONS[frame.season];
  document.getElementById('hTime').textContent = frame.isNight ? 'Night' : 'Day';
  document.getElementById('hPop').textContent = frame.entities.length;

  // Render events
  const evEl = document.getElementById('eventLog');
  evEl.innerHTML = frame.events.map(t => `<div class="ev">${t}</div>`).join('');

  // Render entity inspector if selected
  if (selectedId) {
    const e = frame.entities.find(x => x.id === selectedId);
    if (e) renderReplayInspector(e);
  }
}

function renderReplayInspector(e) {
  const color = SPECIES_COLORS[e.species];
  const ePct = Math.round(e.energy / e.maxAge * 100);
  const hPct = Math.round(e.health * 100);
  const aPct = Math.round(e.age / e.maxAge * 100);
  let html = `
    <div class="ent-header">
      <div class="ent-char" style="color:${color}">${e.char}</div>
      <div class="ent-info">
        <div class="name" style="color:${color}">${e.species}#${e.id}</div>
        <div class="sub">(${e.x},${e.y}) Age ${e.age}/${e.maxAge}</div>
      </div>
    </div>
    <div class="bar-wrap"><div class="bar-label"><span>Energy</span><span>${Math.round(e.energy)}/${Math.round(e.energy + 50)}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${ePct}%;background:${ePct>30?'#3fb950':'#f85149'}"></div></div></div>
    <div class="bar-wrap"><div class="bar-label"><span>Health</span><span>${hPct}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${hPct}%;background:${hPct>30?'#3fb950':'#f85149'}"></div></div></div>
    <div class="traits-grid">
      ${['int','str','spd','soc','con'].map(k => `<div class="trait"><span class="trait-name">${k.toUpperCase()}</span><span>${e.traits[k].toFixed(2)}</span></div>`).join('')}
      <div class="trait"><span class="trait-name">MEM</span><span>${e.memoryCount}/${e.memoryCapacity}</span></div>
    </div>
    <div style="font-size:11px;color:var(--dim);margin:4px 0;">
      Food: ${e.foodEaten} Kills: ${e.kills} Children: ${e.children} Shared: ${e.sharedMem}
    </div>
    <div style="font-size:11px;color:var(--dim);margin:6px 0 2px;">Memories (${e.memoryCount}):</div>
    <div class="mem-list">`;
  const iconMap = { SPATIAL_DANGER: ['danger', '\u26a0'], SPATIAL_FOOD: ['food', '\ud83c\udf3f'],
    MIGRATION: ['migration', '\ud83e\udded'], MATE: ['mate', '\ud83d\udc95'],
    SOCIAL_ENEMY: ['danger', '\ud83d\udc80'], SOCIAL_FRIEND: ['social', '\ud83d\udc64'] };
  for (const m of e.topMemories) {
    const [cls, icon] = iconMap[m.type] || ['social', '-'];
    html += `<div class="mem-item"><div class="mem-icon ${cls}">${icon}</div>
      <div class="mem-body"><div><span class="mem-type">${m.type}</span></div>
      <div class="mem-desc">${m.desc}</div>
      <div class="mem-bar"><div class="mem-bar-fill" style="width:${Math.round(m.strength*100)}%"></div></div></div></div>`;
  }
  html += '</div>';
  inspector.innerHTML = html;
}

function replayExport() {
  const data = JSON.stringify(replayFrames, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `simplife_replay_${Date.now()}.json`;
  a.click(); URL.revokeObjectURL(url);
}

// ── Observer System ──────────────────────────────────────────────
let observeEnabled = false;
let observeTargetId = null;
let observeTimeline = [];  // [{tick, type, desc, reasoning, energy, health, x, y, data}]
let observeEnergyHistory = [];  // [{tick, energy}]
let observeMemoryCountHistory = [];  // [{tick, count}]
let observeStats = { actions: 0, memoriesEncoded: 0, memoriesShared: 0, memoriesForgotten: 0, distance: 0 };
let observeLastEnergy = 0, observeLastMemCount = 0, observeLastX = 0, observeLastY = 0;

function toggleObserveMode() {
  observeEnabled = !observeEnabled;
  const btn = document.getElementById('btnObserve');
  const panel = document.getElementById('observerPanel');
  if (observeEnabled) {
    btn.classList.add('active');
    panel.classList.add('visible');
    observeTimeline = [];
    observeEnergyHistory = [];
    observeMemoryCountHistory = [];
    observeStats = { actions: 0, memoriesEncoded: 0, memoriesShared: 0, memoriesForgotten: 0, distance: 0 };
    // Auto-select first entity if none selected
    if (!observeTargetId && entities.length) {
      observeTargetId = entities[0].id;
    }
    if (observeTargetId) {
      const e = entities.find(x => x.id === observeTargetId);
      if (e) {
        observeLastEnergy = e.energy;
        observeLastMemCount = e.memory.memories.length;
        observeLastX = e.x; observeLastY = e.y;
        addObsEvent('DECISION', `Observer attached to ${e.species}#${e.id}`,
          `Species: ${e.species}, Age: ${e.age}, Energy: ${Math.round(e.energy)}, INT: ${e.traits.int.toFixed(2)}`);
      }
    }
    renderObserver();
  } else {
    btn.classList.remove('active');
    panel.classList.remove('visible');
    observeTargetId = null;
  }
}

function observeEntity(eid) {
  if (!observeEnabled) return;
  observeTargetId = eid;
  observeTimeline = [];
  observeEnergyHistory = [];
  observeMemoryCountHistory = [];
  observeStats = { actions: 0, memoriesEncoded: 0, memoriesShared: 0, memoriesForgotten: 0, distance: 0 };
  const e = entities.find(x => x.id === eid);
  if (e) {
    observeLastEnergy = e.energy;
    observeLastMemCount = e.memory.memories.length;
    observeLastX = e.x; observeLastY = e.y;
    addObsEvent('DECISION', `Observing ${e.species}#${e.id} at (${e.x},${e.y})`,
      `Traits: INT=${e.traits.int.toFixed(2)} STR=${e.traits.str.toFixed(2)} SPD=${e.traits.spd.toFixed(2)} SOC=${e.traits.soc.toFixed(2)}`);
  }
  renderObserver();
}

function addObsEvent(type, desc, reasoning, data) {
  observeTimeline.push({ tick, type, desc, reasoning: reasoning || '', data: data || {},
    energy: 0, health: 0, x: 0, y: 0 });
  if (observeTimeline.length > 200) observeTimeline = observeTimeline.slice(-200);
}

function observeTick() {
  if (!observeEnabled || !observeTargetId) return;
  const e = entities.find(x => x.id === observeTargetId);
  if (!e || !e.alive) {
    if (observeTargetId && observeTimeline.length === 0) {
      addObsEvent('DEATH', `Entity #${observeTargetId} died or not found`, 'No longer alive');
      renderObserver();
    }
    return;
  }

  // Track memory changes
  const curMemCount = e.memory.memories.length;
  if (curMemCount > observeLastMemCount) {
    const newMems = e.memory.memories.slice(observeLastMemCount);
    for (const m of newMems) {
      observeStats.memoriesEncoded++;
      addObsEvent('MEMORY', `New ${m.type}: ${memDesc(m)}`,
        `Strength=${m.strength.toFixed(2)} Valence=${m.valence.toFixed(2)}`);
    }
  } else if (curMemCount < observeLastMemCount) {
    observeStats.memoriesForgotten += observeLastMemCount - curMemCount;
  }

  // Track energy changes
  const eDelta = e.energy - observeLastEnergy;
  if (Math.abs(eDelta) > 2) {
    const reason = eDelta > 0 ? 'ate food' : 'used energy';
    addObsEvent('STATE', `Energy ${eDelta > 0 ? '+' : ''}${eDelta.toFixed(1)} (${reason})`,
      `Energy now ${e.energy.toFixed(0)}/${e.maxE}`);
  }

  // Track position
  const dx = Math.abs(e.x - observeLastX), dy = Math.abs(e.y - observeLastY);
  if (dx + dy > 0) observeStats.distance += dx + dy;

  // Record history
  observeEnergyHistory.push({ tick, energy: e.energy });
  observeMemoryCountHistory.push({ tick, count: curMemCount });
  if (observeEnergyHistory.length > 300) observeEnergyHistory = observeEnergyHistory.slice(-300);
  if (observeMemoryCountHistory.length > 300) observeMemoryCountHistory = observeMemoryCountHistory.slice(-300);

  observeLastEnergy = e.energy;
  observeLastMemCount = curMemCount;
  observeLastX = e.x; observeLastY = e.y;
}

function observeAction(action) {
  if (!observeEnabled || !observeTargetId) return;
  // Check if this action involves the observed entity
  const ent = action.entity || action.attacker || action.parent1;
  if (!ent || ent.id !== observeTargetId) return;

  observeStats.actions++;
  const atype = action.type;
  let desc = '', reasoning = '';

  if (atype === 'move') {
    desc = `Move (${action.dx > 0 ? '+' : ''}${action.dx}, ${action.dy > 0 ? '+' : ''}${action.dy})`;
    reasoning = ent.energy < ent.maxE * 0.5 ? 'searching for food' : 'exploring';
  } else if (atype === 'eat') {
    desc = `Eat ${action.amount.toFixed(1)} food`;
    reasoning = `Energy was ${ent.energy.toFixed(0)}/${ent.maxE}`;
  } else if (atype === 'attack') {
    desc = `Attack #${action.defender?.id || '?'}`;
    reasoning = `STR=${ent.traits.str.toFixed(2)}, hunting`;
  } else if (atype === 'share_memories') {
    desc = `Share with #${action.target?.id || '?'}`;
    observeStats.memoriesShared++;
    reasoning = `SOC=${ent.traits.soc.toFixed(2)}`;
  } else if (atype === 'reproduce') {
    desc = `Reproduce with #${action.parent2?.id || '?'}`;
    reasoning = `Energy ${ent.energy.toFixed(0)} > ${ent.repE}`;
  } else if (atype === 'flee') {
    desc = `Flee (${action.dx > 0 ? '+' : ''}${action.dx}, ${action.dy > 0 ? '+' : ''}${action.dy})`;
    reasoning = 'Escaping threat';
  } else if (atype === 'migrate') {
    desc = `Migrate to (${action.tx},${action.ty})`;
    reasoning = action.reason || 'Following memory';
  }

  if (desc) {
    addObsEvent('ACTION', desc, reasoning);
    renderObserver();
  }
}

function renderObserver() {
  const panel = document.getElementById('observerPanel');
  if (!observeEnabled || !panel.classList.contains('visible')) return;

  const e = entities.find(x => x.id === observeTargetId);
  const summary = document.getElementById('observerSummary');
  const timeline = document.getElementById('observerTimeline');

  if (e) {
    const ePct = Math.round(e.energy / e.maxE * 100);
    document.getElementById('obsEnergyLabel').textContent = `${Math.round(e.energy)}/${e.maxE}`;
    const bar = document.getElementById('obsEnergyBar');
    bar.style.width = ePct + '%';
    bar.style.background = ePct > 30 ? '#3fb950' : '#f85149';

    summary.innerHTML = `
      <span class="os-label">Target</span><span class="os-value" style="color:${SPECIES_COLORS[e.species]}">${e.species}#${e.id}</span>
      <span class="os-label">Position</span><span class="os-value">(${e.x},${e.y})</span>
      <span class="os-label">Actions</span><span class="os-value">${observeStats.actions}</span>
      <span class="os-label">Memories In</span><span class="os-value" style="color:var(--green)">${observeStats.memoriesEncoded}</span>
      <span class="os-label">Shared</span><span class="os-value" style="color:var(--cyan)">${observeStats.memoriesShared}</span>
      <span class="os-label">Forgotten</span><span class="os-value" style="color:var(--red)">${observeStats.memoriesForgotten}</span>
      <span class="os-label">Distance</span><span class="os-value">${observeStats.distance}</span>
      <span class="os-label">Mem Bank</span><span class="os-value">${e.memory.memories.length}/${e.memory.capacity}</span>
    `;
  }

  // Render timeline (newest first, last 50)
  const events = observeTimeline.slice(-50).reverse();
  const typeClass = { ACTION: 'action', MEMORY: 'memory', DECISION: 'decision', DEATH: 'death', STATE: 'state', SHARE: 'share' };
  timeline.innerHTML = events.map(ev =>
    `<div class="obs-ev">
      <span class="obs-tick">t${ev.tick}</span>
      <span class="obs-type ${typeClass[ev.type] || ''}">${ev.type}</span>
      <span class="obs-desc">${ev.desc}</span>
      ${ev.reasoning ? `<span class="obs-reason">${ev.reasoning}</span>` : ''}
    </div>`
  ).join('');
}

// ── Controls ─────────────────────────────────────────────────────
function togglePause() { paused = !paused; render(); }
function resetSim() {
  initWorld();
  if (replayEnabled) { replayFrames = []; replayIndex = 0; addReplayFrame(); }
  if (observeEnabled) { observeTimeline = []; observeEnergyHistory = []; observeMemoryCountHistory = []; observeStats = { actions: 0, memoriesEncoded: 0, memoriesShared: 0, memoriesForgotten: 0, distance: 0 }; }
  render();
}
function setSpeed(v) { speed = parseInt(v); if (tickInterval) { clearInterval(tickInterval); tickInterval = setInterval(tickFn, speed); } }

function tickFn() {
  if (!paused) {
    simStep();
    observeTick();
    if (replayEnabled && tick % 5 === 0) addReplayFrame();  // capture every 5 ticks to save memory
    render();
    if (observeEnabled) renderObserver();
  }
}

// ── Init ─────────────────────────────────────────────────────────
initWorld();
render();
tickInterval = setInterval(tickFn, speed);
window.addEventListener('resize', () => { if (entities.length) renderWorld(); });
</script>
